<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#12699e"/>
      <stop offset="0.55" stop-color="#0d3a58"/>
      <stop offset="1" stop-color="#0a1420"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb0ff"/>
      <stop offset="1" stop-color="#0e75b6"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="218.5" y="52" height="64" width="0">
        <animate attributeName="width" dur="6.0s" repeatCount="indefinite"
                 values="0;0;383.0;383.0" keyTimes="0;0;0.333;1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background glow -->
  <rect x="1" y="1" width="818" height="198" rx="18" fill="url(#bg)"/>

  <!-- typed name -->
  <g clip-path="url(#reveal)">
    <text x="410.0" y="104" text-anchor="middle" font-size="52" font-weight="800" fill="#ffffff">Biswajit Behera</text>
  </g>

  <!-- typing cursor -->
  <rect y="60" width="4" height="52" rx="1.5" fill="#8fd3ff">
    <animate attributeName="x" dur="6.0s" repeatCount="indefinite"
             values="222.5;597.5;597.5" keyTimes="0;0.333;1"/>
    <animate attributeName="opacity" dur="6.0s" repeatCount="indefinite"
             values="1;1;0;1;0;1;0;1" keyTimes="0;0.333;0.55;0.65;0.78;0.86;0.95;1"/>
  </rect>

  <!-- subtitle (fades in after name) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="6.0s" repeatCount="indefinite"
             values="0;0;1;1" keyTimes="0;0.333;0.433;1"/>
    <text x="410.0" y="146" text-anchor="middle" font-size="18" font-weight="600" fill="#cfe8fb" letter-spacing="0.5">Frontend Developer &#160;|&#160; India &#127470;&#127475;</text>
    <rect x="370.0" y="160" width="80" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
</svg>